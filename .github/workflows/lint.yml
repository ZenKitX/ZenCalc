name: Lint

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  lint:
    name: Flutter 代码检查
    runs-on: ubuntu-latest
    
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.0'
          channel: 'stable'
          cache: true

      - name: 获取依赖
        run: flutter pub get

      - name: 代码格式检查
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Flutter 分析
        run: flutter analyze

      - name: 检查导入排序
        run: |
          echo "检查导入语句排序..."
          # 这里可以添加自定义的导入排序检查脚本
        continue-on-error: true

  metrics:
    name: 代码指标
    runs-on: ubuntu-latest
    
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 设置 Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.0'
          channel: 'stable'
          cache: true

      - name: 获取依赖
        run: flutter pub get

      - name: 统计代码行数
        run: |
          echo "📊 代码统计"
          echo "总行数: $(find lib -name '*.dart' | xargs wc -l | tail -1 | awk '{print $1}')"
          echo "文件数: $(find lib -name '*.dart' | wc -l)"
          echo ""
          echo "各模块行数:"
          find lib -type d -maxdepth 2 | while read dir; do
            if [ -d "$dir" ]; then
              lines=$(find "$dir" -name '*.dart' 2>/dev/null | xargs wc -l 2>/dev/null | tail -1 | awk '{print $1}' || echo "0")
              if [ "$lines" != "0" ]; then
                echo "  $dir: $lines 行"
              fi
            fi
          done

      - name: 分析复杂度
        run: |
          echo "🔍 复杂度分析"
          flutter analyze --no-fatal-infos | grep -E "info|warning|error" | wc -l || echo "0 个问题"
        continue-on-error: true
