name: Code Review

on:
  pull_request:
    branches: [ main, develop ]
  push:
    branches: [ main, develop ]

jobs:
  analyze:
    name: 代码分析
    runs-on: ubuntu-latest
    
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.0'
          channel: 'stable'
          cache: true

      - name: 获取依赖
        run: flutter pub get

      - name: 验证格式
        run: dart format --set-exit-if-changed .
        continue-on-error: true

      - name: 静态分析
        run: flutter analyze

      - name: 检查未使用的文件
        run: |
          echo "检查未使用的导入和文件..."
          dart run dart_code_metrics:metrics check-unused-files lib
        continue-on-error: true

  test:
    name: 运行测试
    runs-on: ubuntu-latest
    
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.0'
          channel: 'stable'
          cache: true

      - name: 获取依赖
        run: flutter pub get

      - name: 运行测试
        run: flutter test --coverage

      - name: 上传覆盖率报告
        uses: codecov/codecov-action@v3
        with:
          files: ./coverage/lcov.info
          fail_ci_if_error: false
        continue-on-error: true

  build:
    name: 构建检查
    runs-on: ubuntu-latest
    
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.0'
          channel: 'stable'
          cache: true

      - name: 获取依赖
        run: flutter pub get

      - name: 构建 APK
        run: flutter build apk --debug --no-shrink
        continue-on-error: true

  security:
    name: 安全检查
    runs-on: ubuntu-latest
    
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.0'
          channel: 'stable'
          cache: true

      - name: 获取依赖
        run: flutter pub get

      - name: 检查依赖漏洞
        run: |
          echo "检查依赖包的安全漏洞..."
          flutter pub outdated
        continue-on-error: true

  code-quality:
    name: 代码质量
    runs-on: ubuntu-latest
    
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.0'
          channel: 'stable'
          cache: true

      - name: 获取依赖
        run: flutter pub get

      - name: 代码复杂度分析
        run: |
          echo "分析代码复杂度..."
          flutter analyze --no-fatal-infos --no-fatal-warnings
        continue-on-error: true

      - name: 检查代码风格
        run: |
          echo "检查 Dart 代码风格..."
          dart format --output=none --set-exit-if-changed .
        continue-on-error: true

  comment-pr:
    name: PR 评论
    runs-on: ubuntu-latest
    needs: [analyze, test, build]
    if: github.event_name == 'pull_request'
    
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.0'
          channel: 'stable'
          cache: true

      - name: 获取依赖
        run: flutter pub get

      - name: 生成分析报告
        id: analysis
        run: |
          echo "生成代码分析报告..."
          flutter analyze > analysis.txt 2>&1 || true
          
          # 统计问题数量
          ISSUES=$(grep -c "info\|warning\|error" analysis.txt || echo "0")
          echo "issues=$ISSUES" >> $GITHUB_OUTPUT
          
          # 生成摘要
          echo "## 📊 代码审查报告" > report.md
          echo "" >> report.md
          echo "### 静态分析" >> report.md
          echo "发现 $ISSUES 个问题" >> report.md
          echo "" >> report.md
          echo "### 详细信息" >> report.md
          echo "\`\`\`" >> report.md
          head -50 analysis.txt >> report.md
          echo "\`\`\`" >> report.md

      - name: 评论 PR
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('report.md', 'utf8');
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: report
            });
