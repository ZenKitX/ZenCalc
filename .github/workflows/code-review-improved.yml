name: Code Review (Improved)

on:
  pull_request:
    branches: [ main, develop ]
  push:
    branches: [ main, develop ]

jobs:
  # 使用 Flutter Action 的完整功能
  flutter-analyze:
    name: Flutter 分析
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: 设置 Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.0'
          channel: 'stable'
          cache: true
      
      - name: 安装依赖
        run: flutter pub get
      
      # 使用 reviewdog 进行代码审查评论
      - name: 运行 Flutter Analyze with reviewdog
        uses: reviewdog/action-flutter-analyze@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          reporter: github-pr-review
          level: warning
          fail_on_error: true

  # 使用 Codecov 进行测试覆盖率
  test-coverage:
    name: 测试覆盖率
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.0'
          channel: 'stable'
          cache: true
      
      - run: flutter pub get
      - run: flutter test --coverage
      
      # 使用 Codecov 官方 Action
      - name: 上传到 Codecov
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/lcov.info
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: true

  # 使用 Danger 进行自动化代码审查
  danger:
    name: Danger 代码审查
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    
    steps:
      - uses: actions/checkout@v4
      
      - name: 运行 Danger
        uses: danger/danger-js@main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # 使用 SonarQube 进行代码质量分析
  sonarqube:
    name: SonarQube 分析
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.0'
          channel: 'stable'
          cache: true
      
      - run: flutter pub get
      - run: flutter test --coverage
      
      - name: SonarQube Scan
        uses: sonarsource/sonarqube-scan-action@master
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

  # 使用 Super-Linter 进行多语言检查
  super-linter:
    name: Super Linter
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: 运行 Super-Linter
        uses: github/super-linter@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VALIDATE_ALL_CODEBASE: false
          VALIDATE_DART: true
          VALIDATE_YAML: true
          VALIDATE_JSON: true
          VALIDATE_MARKDOWN: true
